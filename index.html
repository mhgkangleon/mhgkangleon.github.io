<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
:root {
  --plum:    #5C2D4A;
  --plum-dk: #3A1A2E;
  --rose:    #C97B8A;

  --border:  #E8D5DC;
  --white:   #ffffff;
}
body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }

.reveal {
  transition: visibility 0s, opacity 0.8s cubic-bezier(.4,0,.2,1), transform 0.8s cubic-bezier(.4,0,.2,1);
}
.reveal.from-left  { transform: translateX(-50px); }
.reveal.from-right { transform: translateX(50px); }
.reveal.js-hide    { opacity: 0; visibility: hidden; }
.reveal.visible    { opacity: 1; visibility: visible; transform: translate(0); }
.reveal-delay-1 { transition-delay: 0.15s; }
.reveal-delay-2 { transition-delay: 0.30s; }
.reveal-delay-3 { transition-delay: 0.45s; }
.reveal-delay-4 { transition-delay: 0.60s; }

@media (prefers-reduced-motion: reduce) {
  .reveal, .reveal.js-hide, .reveal.visible,
  .reveal.from-left, .reveal.from-right {
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    transition: none !important;
    animation: none !important;
  }
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 48px;
  background: rgba(253,248,245,0.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent; transition: border-color 0.3s;
}
nav.scrolled { border-bottom-color: var(--border); }
.nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic; color: var(--plum); }
.nav-links { display: flex; gap: 32px; }
.nav-links a { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.nav-links a:hover { color: var(--plum); }

/* Hamburger */
.nav-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 36px; height: 36px;
  background: none; border: none; cursor: pointer; padding: 4px;
  z-index: 1001;
}
.nav-hamburger span {
  display: block; width: 22px; height: 1.5px;
  background: var(--plum);
  transition: all 0.3s cubic-bezier(.4,0,.2,1);
  transform-origin: center;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* Mobile drawer */
.nav-drawer {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(253,248,245,0.97);
  backdrop-filter: blur(16px);
  z-index: 1000;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 0;
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.nav-drawer.open {
  opacity: 1;
  transform: translateY(0);
  pointer-events: all;
}
.nav-drawer a {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 300;
  font-style: italic;
  color: var(--plum-dk);
  text-decoration: none;
  padding: 14px 0;
  letter-spacing: 0.02em;
  transition: color 0.2s;
  border-bottom: 1px solid var(--border);
  width: 220px;
  text-align: center;
}
.nav-drawer a:last-child { border-bottom: none; }
.nav-drawer a:hover { color: var(--rose); }

/* X close button inside drawer */
.drawer-close {
  position: absolute;
  top: 20px; right: 20px;
  width: 40px; height: 40px;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--plum);
  border-radius: 50%;
  transition: background 0.2s;
}
.drawer-close:hover { background: var(--blush); }
.drawer-close svg { width: 22px; height: 22px; }

/* Tap-away backdrop */
.nav-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: transparent;
}
.nav-backdrop.open { display: block; }

<div class="stats-strip">
  <div class="stats-inner" style="grid-template-columns: repeat(${RESUME.stats.length}, 1fr)">
    ${RESUME.stats.map((s, i) => `
    <div class="stat reveal reveal-delay-${i+1}">
      <div class="stat-number">${s.number}</div>
      <div class="stat-label">${s.label}</div>
    </div>`).join('')}
  </div>
</div>

<!-- ABOUT -->
<div class="about-band" id="about">
  <div class="about-inner">
    <div class="reveal from-left">
      <div class="about-quote">${RESUME.aboutQuote}</div>
    </div>
    <div class="reveal from-right">
      <p class="about-text">${RESUME.aboutText}</p>
      <div class="about-tags">${RESUME.aboutTags.map(t => `<span class="about-tag">${t}</span>`).join('')}</div>
    </div>
  </div>
</div>

<!-- EXPERIENCE -->
<div id="experience">
  <div class="section-wrap">
    <div class="section-label reveal">Career Journey</div>
    <h2 class="section-heading reveal">Where I've <em>made an impact</em></h2>
    <div class="timeline">
      ${RESUME.experience.map(job => `
      <div class="t-item reveal">
        <div class="t-dot"></div>
        <div class="t-meta">
          <span class="t-period">${job.period}</span>
          <span class="t-company">${job.company}</span>
        </div>
        <h3 class="t-role">${job.role}</h3>
        <ul class="t-bullets">
          ${job.bullets.map(b => `<li>${b}</li>`).join('')}
        </ul>
        ${job.highlight ? `<div class="t-highlight">${job.highlight}</div>` : ''}
      </div>`).join('')}
    </div>
  </div>
</div>

<!-- SKILLS -->
<div class="skills-bg" id="skills">
  <div class="skills-inner">
    <div class="section-label reveal">Expertise</div>
    <h2 class="section-heading reveal">Skills &amp; <em>Toolkit</em></h2>
    <div class="skills-mosaic">
      ${RESUME.skills.map((tile, i) => `
      <div class="skill-tile${tile.wide ? ' wide' : ''} reveal reveal-delay-${(i % 4) + 1}">
        <div class="tile-icon">${svg(tile.icon)}</div>
        <div class="tile-title">${tile.title}</div>
        <div class="tile-chips">
          ${tile.chips.map(c => `<span class="chip${c.star ? ' star' : ''}">${c.label}</span>`).join('')}
        </div>
      </div>`).join('')}
    </div>
  </div>
</div>

<!-- CERTIFICATIONS -->
<div class="certs-section" id="certifications">
  <div class="certs-deco"></div>
  <div class="certs-inner">
    <div class="section-label reveal">Credentials</div>
    <h2 class="section-heading reveal">Officially <em>certified.</em></h2>
    <div class="cert-cards">
      ${RESUME.certifications.map((c, i) => `
      <div class="cert-card reveal reveal-delay-${i+1}">
        <div class="cert-badge">${svg(c.icon)}</div>
        <div class="cert-name">${c.name}</div>
        <div class="cert-issuer">${c.issuer}</div>
        <div class="cert-details">
          <div class="cert-detail">${c.date}</div>
          <div class="cert-detail">${c.id}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>
</div>

<!-- EDUCATION + STRENGTHS -->
<div id="education">
  <div class="section-wrap">
    <div class="section-label reveal">Academic Background</div>
    <h2 class="section-heading reveal"><em>Education</em></h2>
    <div class="edu-block">
      <div class="reveal from-left">
        <div class="edu-circle">
          <div class="edu-monogram">${RESUME.education.monogram}</div>
          <div class="edu-school-abbr">University</div>
        </div>
      </div>
      <div class="reveal from-right">
        <div class="edu-content">
          <h3>${RESUME.education.degree}</h3>
          <div class="edu-school">${RESUME.education.school}</div>
          <div class="edu-period">${RESUME.education.period}</div>
          <span class="edu-pill">${RESUME.education.degree}</span>
        </div>
      </div>
    </div>

    <div style="margin-top: 100px">
      <div class="section-label reveal">Strengths</div>
      <h2 class="section-heading reveal">The person <em>behind the work</em></h2>
      <div class="personal-grid">
        ${RESUME.strengths.map((s, i) => `
        <div class="p-card reveal reveal-delay-${i+1}">
          <div class="p-icon">${svg(strengthIcons[i % strengthIcons.length])}</div>
          <div class="p-text">${s}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="contact-footer" id="contact">
  <h2>${RESUME.footerHeadline}<br><em>${RESUME.footerItalic}</em></h2>
  <p>${RESUME.footerSub}</p>
  <div class="contact-links">
    <a href="mailto:${RESUME.email}" class="contact-link">${svg('email')} ${RESUME.email}</a>
    <a href="${RESUME.linkedin}" target="_blank" class="contact-link">${svg('linkedin')} LinkedIn</a>
    ${RESUME.cvFile ? `<a href="${RESUME.cvFile}" download class="contact-link-cv"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download CV</a>` : ''}
  </div>
  <div class="copy-line">Crafted with care &nbsp;·&nbsp; <span>${RESUME.name}</span> &nbsp;·&nbsp; ${RESUME.role}</div>
</footer>
`;

/* ── SCROLL REVEAL ── */
const revealObs = new IntersectionObserver((entries) => {
  entries.forEach(el => {
    if (el.isIntersecting) {
      el.target.classList.remove('js-hide');
      el.target.classList.add('visible');
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

document.querySelectorAll('.reveal, .t-item').forEach(el => {
  if (!el.classList.contains('from-left') && !el.classList.contains('from-right')) {
    el.style.transform = 'translateY(40px)';
  }
  el.classList.add('js-hide');
  revealObs.observe(el);
});

/* ── STICKY NAV ── */
window.addEventListener('scroll', () => {
  document.getElementById('main-nav').classList.toggle('scrolled', window.scrollY > 60);
});

/* ── HAMBURGER MENU ── */
const hamburger = document.getElementById('nav-hamburger');
const drawer    = document.getElementById('nav-drawer');
const backdrop  = document.getElementById('nav-backdrop');
const closeBtn  = document.getElementById('drawer-close');

function toggleMenu(open) {
  hamburger.classList.toggle('open', open);
  drawer.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
  hamburger.setAttribute('aria-expanded', open);
  drawer.setAttribute('aria-hidden', !open);
  document.body.style.overflow = open ? 'hidden' : '';
}

hamburger.addEventListener('click', () => toggleMenu(true));
closeBtn.addEventListener('click',  () => toggleMenu(false));
backdrop.addEventListener('click',  () => toggleMenu(false));

document.querySelectorAll('.drawer-link').forEach(link => {
  link.addEventListener('click', () => toggleMenu(false));
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') toggleMenu(false);
});
</script>
</body>
</html>
